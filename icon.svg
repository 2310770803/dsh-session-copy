<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Session Copy Menu">
  <!-- No background plate: the artwork sits on whatever surface the host draws
       it against, so the same file reads on both the light and dark themes. -->
  <defs>
    <!-- Hides the back sheet where the front sheet covers it, so the faint
         outline never shows through the slots cut out below. -->
    <mask id="behind" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <rect x="17" y="24" width="23" height="26" rx="5.5" fill="#000"/>
    </mask>
    <!-- The two rules were the background colour showing through the white
         sheet; with the sheet blue they become cut-outs, which keeps them
         legible on any background instead of blue-on-blue. -->
    <mask id="slots" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#000"/>
      <rect x="17" y="24" width="23" height="26" rx="5.5" fill="#fff"/>
      <path d="M23.5 34.5h10M23.5 40h7" fill="none" stroke="#000" stroke-width="2.6" stroke-linecap="round"/>
    </mask>
  </defs>
  <g mask="url(#behind)">
    <!-- The brighter end of the old gradient, so the outline still separates
         from a dark host background where the main sheet's blue is dim. -->
    <rect x="26" y="14" width="21" height="25" rx="5" fill="none" stroke="#5B7BFF" stroke-opacity="0.85" stroke-width="2.6"/>
  </g>
  <rect x="17" y="24" width="23" height="26" rx="5.5" fill="#3D53F5" mask="url(#slots)"/>
</svg>
