name: Publish to npm

# The plugin market indexes (DSH's Plugins -> Discover tab, and the
# awesome-dsh-plugin catalog behind it) list an entry as soon as the repository
# exists, but the generated format-1 index at
# https://cdn.jsdelivr.net/npm/dsh-plugin-catalog/index.json can only carry
# entries that resolve to a published npm package. Publishing here is what
# turns the GitHub repository into a market-listed plugin.
#
# Two ways to authenticate, neither of which this repository can grant itself:
#
#   Trusted publishing (preferred, no secret at all). Configure a trusted
#   publisher on npmjs.com for this repository + this workflow filename, then
#   set the repository variable NPM_TRUSTED_PUBLISHING to true. npm mints a
#   short-lived OIDC token per run, so there is nothing long-lived to leak.
#
#   A granular access token stored as the NPM_TOKEN secret. npm stopped issuing
#   classic tokens in November 2025, so this has to be a granular token with
#   read/write package permission and "Bypass 2FA" checked (that flag is
#   unchecked by default, and every package now refuses a publish that carries
#   neither 2FA nor a bypass token, so without it the publish 403s).
#
# Timing matters for the first publish either way. A newly created trusted
# publisher must validate itself with a successful publish within 48 hours or it
# expires and cannot be edited, only deleted and recreated; and a brand-new
# package name has to exist before either credential can be attached to it.
# So: publish once with a token (or by hand), then attach the trusted publisher
# and cut the next release. Ordering it the other way risks a dead 48-hour
# window in a repository nobody is watching.
#
# With neither configured the job skips the publish step and says so, rather
# than failing a release for a reason unrelated to the code.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Pack and inspect the tarball without publishing
        type: boolean
        default: false

permissions:
  contents: write
  # Needed for trusted publishing: lets the run request an OIDC identity token
  # that npm exchanges for a short-lived publish credential.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify the manifest matches the release tag
        id: manifest
        run: |
          node -e '
            const pkg = require("./package.json")
            const tag = process.env.GITHUB_REF_NAME ?? ""
            console.log(`package ${pkg.name}@${pkg.version}`)
            console.log(`tag ${tag || "(none)"}`)
            // A release tag is optional here: workflow_dispatch publishes
            // whatever the manifest says. When a tag is present it must be the
            // same version, so a mistagged release cannot ship the wrong code.
            if (tag && tag !== `v${pkg.version}` && tag !== pkg.version) {
              console.error(`release tag ${tag} does not match package version ${pkg.version}`)
              process.exit(1)
            }
            if (!pkg.dsh?.bundle?.patch) {
              console.error("package.json declares no dsh.bundle — the market cannot install it")
              process.exit(1)
            }
          '

      - name: Inspect the tarball contents
        run: npm pack --dry-run

      # The awesome-dsh-plugin catalog lets an entry declare a prebuilt tarball
      # instead of a build-from-source install, and recommends it for plugins
      # that are not on npm. Its one documented way to rot is a
      # `releases/latest/download/<file>` URL whose <file> carries the version:
      # `latest` is resolved per request but the filename is literal, so the
      # link dies at the next release. The fix is to keep the asset name
      # version-free on every release, which is what this step does — the URL
      # in data/plugins/2310770803__dsh-session-copy.yml never has to change.
      - name: Attach a version-free tarball to the release
        if: github.event_name == 'release'
        run: |
          npm pack --pack-destination .
          mv "dsh-session-copy-$(node -p 'require("./package.json").version').tgz" dsh-session-copy.tgz
          gh release upload "${GITHUB_REF_NAME}" dsh-session-copy.tgz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publishing is attempted when either credential path is configured:
      # a trusted publisher (no secret; npm mints a token via OIDC) or the
      # NPM_TOKEN secret. Neither being present is a configuration gap, not a
      # code failure, so it reports skipped instead of red.
      - name: Check for an npm credential
        id: credential
        run: |
          if [ "${TRUSTED}" = "true" ] || [ -n "${NPM_TOKEN}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=npm publish skipped::No npm credential. Configure a trusted publisher on npmjs.com and set the repository variable NPM_TRUSTED_PUBLISHING=true, or add an NPM_TOKEN secret (granular token, Bypass 2FA checked)."
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          TRUSTED: ${{ vars.NPM_TRUSTED_PUBLISHING }}

      - name: Publish
        if: steps.credential.outputs.present == 'true' && (github.event_name == 'release' || inputs.dry-run != true)
        run: npm publish --access public
        env:
          # A granular token path. Empty under trusted publishing, where the npm
          # CLI detects the OIDC environment and authenticates before falling
          # back to any token.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Confirms the publish landed, so a silent no-op is visible in the run.
      - name: Verify the release is on npm
        if: steps.credential.outputs.present == 'true' && github.event_name == 'release'
        run: |
          sleep 5
          # Read the version from the manifest, not from the tag: the tag is
          # v1.1.1 and the registry key is 1.1.1.
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          npm view "${name}@${version}" version \
            || echo "::warning title=not visible yet::npm accepted the publish but ${name}@${version} is not readable yet; the registry can lag a few minutes."
